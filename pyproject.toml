[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duplio"
version = "0.1.0"
description = "Safety-first duplicate finder and backup toolkit for computers, phones and SMB shares."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Duplio contributors" }]
keywords = ["duplicates", "dedupe", "backup", "mtp", "smb", "android", "snapshot"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
# Terminal UI.
tui = ["textual>=0.80"]
# Faster hashing (pure-stdlib fallbacks are used when these are absent).
fast = ["blake3>=0.4", "xxhash>=3.0"]
# Native SMB/CIFS access without mounting the share.
smb = ["smbprotocol>=1.10"]
# Similar-image detection and EXIF dates for phone imports.
media = ["Pillow>=10.0"]
# Content-defined chunking for backup repositories (shares data after insertions into big files).
cdc = ["numpy>=1.26"]
# Client-side encryption of backup repositories.
encrypt = ["cryptography>=42"]
# Send files to the operating-system trash.
trash = ["Send2Trash>=1.8"]
all = [
  "textual>=0.80",
  "blake3>=0.4",
  "xxhash>=3.0",
  "smbprotocol>=1.10",
  "Pillow>=10.0",
  "Send2Trash>=1.8",
  "cryptography>=42",
  "numpy>=1.26",
]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
duplio = "duplio.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duplio = ["tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008", "B027", "RUF012", "SIM102", "SIM117", "UP031", "RUF046", "SIM110"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
