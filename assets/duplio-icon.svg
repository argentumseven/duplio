<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Duplio</title>
  <desc id="d">Two faceless grey silhouettes, hunched and legs apart, seen from the front. They stand joined at the feet and lean away from each other, peeling apart, with a few stretched strands still holding them together.</desc>
  <defs>
    <!-- One hunched, faceless figure, drawn from the front. Feet at y=0, origin on its centre line. -->
    <g id="figure" stroke-linecap="round" stroke-linejoin="round">
      <!-- head, sunk between the shoulders -->
      <ellipse cx="0" cy="-139" rx="19" ry="22" stroke="none"/>
      <!-- rounded, raised shoulders tapering to the waist -->
      <path d="M -9 -121 Q -31 -121 -45 -107 Q -51 -99 -46 -89 L -25 -52 Q -23 -43 -15 -43 L 15 -43 Q 23 -43 25 -52 L 46 -89 Q 51 -99 45 -107 Q 31 -121 9 -121 Z" stroke="none"/>
      <!-- arms hanging forward -->
      <path d="M -43 -100 C -57 -80 -57 -52 -49 -24" fill="none" stroke-width="13"/>
      <path d="M 43 -100 C 57 -80 57 -52 49 -24" fill="none" stroke-width="13"/>
      <!-- legs apart, knees slightly bent -->
      <path d="M -10 -46 L -23 -26 L -30 -6" fill="none" stroke-width="20"/>
      <path d="M 10 -46 L 23 -26 L 30 -6" fill="none" stroke-width="20"/>
    </g>
  </defs>

  <rect width="256" height="256" rx="52" fill="#ececec"/>

  <g transform="translate(0 -14) translate(128 232) scale(1.08) translate(-128 -232)">
    <!-- Stretched strands, drawn first so both bodies cover their ends: only the part in the gap shows. -->
    <g fill="none" stroke="#8c8c8c" stroke-linecap="round">
      <path d="M 70 84 Q 128 112 186 78" stroke-width="3.4"/>
      <path d="M 72 102 Q 128 126 184 96" stroke-width="3"/>
      <path d="M 76 121 Q 128 141 182 115" stroke-width="2.6"/>
      <path d="M 80 140 Q 128 156 180 134" stroke-width="2.2"/>
      <path d="M 86 160 Q 128 172 176 154" stroke-width="1.8"/>
    </g>

    <!-- The one behind: lighter, leaning right. -->
    <g transform="translate(150 232) rotate(13)" fill="#777" stroke="#777">
      <use href="#figure"/>
    </g>

    <!-- The one in front: darker, leaning left. A thin light edge keeps the two readable where they overlap. -->
    <g transform="translate(106 232) rotate(-13)">
      <use href="#figure" fill="#ececec" stroke="#ececec" stroke-width="6"/>
      <g fill="#1f1f1f" stroke="#1f1f1f"><use href="#figure"/></g>
    </g>
  </g>
</svg>
